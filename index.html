<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>五朵花泰國曼谷趴趴走</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
:root{--b:#23406B;--r:#D9482F;--y:#F2B441;--p:#E58FA6;--g:#2F7D6B;--l:#7FB9D6}
*{box-sizing:border-box}body{margin:0;background:#EEF4F3;color:#1d2b3a;font:16px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:560px;margin:auto;padding:12px}h1{font-size:22px;margin:8px 0;color:var(--b);text-align:center}h2{font-size:18px;color:var(--b);margin:14px 0 4px}
.c{background:#fff;border:1.5px solid var(--b);border-radius:16px;padding:12px;margin:10px 0}
.s{background:#DCEEF7}.f{background:#FCEFCF}.b{background:#F9DCE3}.m{background:#DDEEE9}.h{background:#F3F4F6}
.nv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
button,.bt{font:700 16px inherit;font-family:inherit;min-height:44px;padding:6px 14px;border:1.5px solid var(--b);border-radius:16px;background:#fff;color:var(--b);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.nv button{min-height:64px}.on{background:#35588A!important;color:#fff!important;border:1.5px solid var(--b)!important;border-radius:16px}
.dy{display:flex;gap:8px;overflow-x:auto;padding:4px 0}.dy button{flex:0 0 auto;flex-direction:column;line-height:1.3;min-width:112px;min-height:64px}.dy button.on{background:#DC9FB4!important;color:#23406B!important;border-color:#23406B!important}
.bar{position:sticky;top:0;z-index:5;background:#fff;border:1.5px solid var(--b);border-radius:16px;padding:6px 10px;margin:8px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.tg{display:inline-block;background:var(--b);color:#fff;border-radius:10px;padding:0 8px;font-size:14px;margin-left:4px}.tg.r{background:var(--r)}.tg.e{background:#fff;color:var(--b);border:1px solid var(--b)}
.lg{margin:0 0 0 14px;padding:6px 10px;border-left:3px dashed var(--b);font-size:15px;color:#41536b}
.k{animation:pop .45s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i)*60ms)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
#hero{overflow-x:auto;border:1.5px solid var(--b);border-radius:16px;line-height:0}#hero img{width:100%;display:block}#hero.z img{width:1100px;max-width:none}.rp{animation:rp 3s ease-in-out infinite alternate}@keyframes rp{to{transform:translateX(-14px)}}
input[type=text],input[type=number],textarea{font:inherit;padding:6px 8px;border:1.5px solid var(--b);border-radius:10px;min-width:0;width:100%}
.row{display:flex;gap:6px;align-items:center;margin:4px 0}.row>*:first-child{flex:1}
.pb{height:12px;border:1.5px solid var(--b);border-radius:8px;overflow:hidden}.pb i{display:block;height:100%;background:var(--g)}
.bd{border:1.5px dashed var(--b);padding:10px;border-radius:12px;background:#fff}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--g)}
small{color:#41536b}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
